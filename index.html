<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miracema Biscuit & 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel=manifest href=manifest.json><meta name=theme-color content="#6B3419">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#FBF6EE;--card:#fff;--tx:#3b2414;--mu:#8a6f5a;--br:#6B3419;--ac:#C98A4B;--cr:#F5DDBB;--ln:#ecdcc6;--ok:#3d8b5a;--bad:#b84a3a}
[data-theme=dark]{--bg:#1d1510;--card:#2a1f17;--tx:#f5e6d3;--mu:#b89c82;--br:#e0a56b;--ac:#C98A4B;--cr:#3a2a1e;--ln:#4a3828}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:none;min-height:100vh}#side{width:220px;background:var(--cr);padding:16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
#side img{width:100%;margin-bottom:12px}.lb{display:none}[data-theme=dark] .lb{display:block}[data-theme=dark] .ld{display:none}
#side a{padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--tx)}#side a.on{background:var(--br);color:#fff}
#side .sp{flex:1}#main{flex:1;padding:24px;min-width:0}
h1{margin:0 0 16px;font-size:26px;color:var(--br)}h3{color:var(--br);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kp b{display:block;font-size:24px;color:var(--br)}.kp span{color:var(--mu);font-size:13px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:12px}
button{font:inherit;font-weight:800;background:var(--br);color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
button.g{background:transparent;color:var(--br);border:2px solid var(--br)}button.ic{background:none;color:var(--tx);padding:4px 6px;font-size:16px}
input,select{font:inherit;width:100%;padding:9px 10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);font-weight:700;margin-bottom:10px}label input,label select{margin-top:4px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:13px;color:var(--mu);padding:8px}td{padding:8px;border-top:1px solid var(--ln)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#mw{display:none;position:fixed;inset:0;background:#0007;place-items:center;padding:12px;z-index:9}#md{background:var(--card);border-radius:18px;padding:20px;width:560px;max-width:100%;max-height:92vh;overflow:auto}
#login{display:none;min-height:100vh;place-items:center}#login form{width:340px;text-align:center}#login img{width:100%}
.res{position:sticky;top:12px;background:var(--br);color:#fff;border-radius:18px;padding:18px}.res b{font-size:30px}.res div{display:flex;justify-content:space-between;padding:3px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #0003;vertical-align:middle;margin-right:6px}
.bar{height:8px;border-radius:6px;background:var(--ln)}.bar i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.low{color:var(--bad);font-weight:800}
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}.col{background:var(--cr);border-radius:16px;padding:12px;min-height:220px}
@media(max-width:760px){#app{flex-direction:column}#side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap}#side img{display:none}#side .sp{display:none}.g2{grid-template-columns:1fr}}
</style></head><body>

<div id=login><form onsubmit="login();return false"><img src="logo-marrom.png" alt="Miracema Artes Biscuit 3D">
<label>E-mail<input id=em type=email required></label><label>Senha<input id=pw type=password required></label><button style="width:100%">Entrar</button></form></div>

<div id=app><nav id=side><img class=ld src="logo-marrom.png" alt="Miracema"><img class=lb src="logo-branca.png" alt="Miracema"><div id=nav></div><div class=sp></div>
<a onclick=exp()>📥 Exportar Excel</a><a onclick="tema()">🌓 Claro / escuro</a><a onclick="sb.auth.signOut().then(()=>location.reload())">Sair</a></nav><main id=main></main></div>
<div id=mw onclick="if(event.target==this)cm()"><div id=md></div></div>

<script>
/* ===== CONFIGURE AQUI (Supabase > Project Settings > API) ===== */
const{SB_URL,SB_KEY}=window.CFG;
/* =============================================================== */
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),N=v=>+v||0;
const T=['configuracoes','impressoras','filamentos','pecas','kits','kit_itens','vendas','itens_venda','clientes','despesas','investimentos','compras'];
let D={},cur='dashboard',S={items:[],desc:0},ch=[];
const NAV=[['dashboard','📊 Dashboard'],['pecas','🧩 Peças'],['kits','🎁 Kits'],['vendas','🛒 Vendas'],['fila','🖨️ Fila de produção'],['clientes','👥 Clientes'],['despesas','💸 Despesas'],['calc','🧮 Calculadora'],['filamentos','🧵 Filamentos'],['compras','🛍️ Compras'],['config','⚙️ Configurações']];
const F={
 pecas:[['nome','Nome da peça','text'],['categoria','Categoria','text'],['material','Material','select',['PLA','PETG','ABS','TPU']],['foto_url','Link da foto (endereço direto da imagem)','url'],['stl_url','Link do arquivo STL','url'],['qtd_atacado','Atacado: a partir de (unidades)','number'],['preco_atacado','Atacado: preço de cada (R$)','number'],['gramas','Gramas','number'],['horas','Horas de impressão','number'],['custo','Custo (R$)','number'],['preco','Preço de venda (R$)','number']],
 filamentos:[['cor','Cor','text'],['hex','Tom','color'],['marca','Marca','text'],['material','Material','select',['PLA','PETG','ABS','TPU']],['preco_kg','Preço do kg (R$)','number'],['peso_rolo','Peso do rolo (g)','number'],['gramas_restantes','Gramas restantes','number'],['alerta_gramas','Avisar abaixo de (g)','number'],['etiqueta','Etiqueta (opcional, ex.: rolo da Shopee)','text'],['situacao','Situação','select',['Em estoque','A caminho','Esgotado']]],
 investimentos:[['data','Data','date'],['descricao','Descrição (ex.: Impressora, bico extra)','text'],['valor','Valor (R$)','number']],
 despesas:[['data','Data','date'],['categoria','Categoria','select',['Filamento','Peças e bicos','Manutenção','Embalagem','Energia','Equipamento','Outros']],['descricao','Descrição','text'],['valor','Valor (R$)','number']],
 clientes:[['nome','Nome','text'],['telefone','WhatsApp (com DDD)','tel'],['obs','Observações','text']],
 impressoras:[['nome','Nome','text'],['watts','Consumo (W)','number']],
 configuracoes:[['tarifa_kwh','Tarifa de energia (R$/kWh)','number'],['margem_padrao','Margem padrão (%)','number'],['falhas_pct','Falhas (%)','number'],['desgaste_hora','Desgaste da máquina (R$/hora)','number'],['embalagem','Embalagem (R$)','number'],['mao_obra_hora','Mão de obra (R$/hora)','number'],['meta_mensal','Meta mensal (R$)','number'],['validade_dias','Validade do orçamento (dias)','number'],['prazo_entrega','Prazo de entrega (aparece no orçamento)','text'],['forma_pagamento','Formas de pagamento (aparece no orçamento)','text']]};

const tema=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'':'dark';localStorage.setItem('t',d.dataset.theme);go(cur)};
try{document.documentElement.dataset.theme=localStorage.getItem('t')||''}catch(e){}
async function load(){for(const t of T){const{data,error}=await sb.from(t).select('*').order('id');if(error)alert(t+': '+error.message);D[t]=data||[]}D.cfg=D.configuracoes[0]||{}}
async function init(){const{data}=await sb.auth.getSession();data.session?start():$('#login').style.display='grid'}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?alert('Não entrou: '+error.message):start()}
async function start(){$('#login').style.display='none';$('#app').style.display='flex';await load();go('dashboard')}
function go(v){cur=v;if(v=='calc')CFS=[null,null,null,null];ch.forEach(c=>c.destroy());ch=[];$('#nav').innerHTML=NAV.map(([k,l])=>`<a class="${k==v?'on':''}" onclick="go('${k}')" style="display:block">${l}</a>`).join('');$('#main').innerHTML=V[v]();P[v]&&P[v]()}
const cm=()=>$('#mw').style.display='none';
const tb=(h,rows)=>rows.length?`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p style="color:var(--mu)">Nada por aqui ainda. Use o botão de cadastro acima.</p>';
const acts=(t,id)=>`<button class=ic title=Editar onclick="${t=='kits'?'ekit':'edit'}(${t=='kits'?'':`'${t}',`}${id})">✏️</button><button class=ic title=Excluir onclick="del('${t}',${id})">🗑️</button>`;
const opt=(l,s)=>l.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');
const dot=f=>f?`<span class=dot style="background:${f.hex}"></span>${f.cor}`:'-';

function edit(t,id){const v=D[t].find(x=>x.id==id)||{};$('#md').innerHTML=`<form onsubmit="return sv(event,'${t}',${id||0})"><h3>${id?'Editar':'Novo cadastro'}</h3>${F[t].map(([k,l,ty,o])=>`<label>${l}${ty=='select'?`<select name=${k}>${opt(o,v[k])}</select>`:`<input name=${k} type=${ty} step=any value="${v[k]??(ty=='date'?new Date().toISOString().slice(0,10):'')}">`}</label>`).join('')}${t=='pecas'?'<label>Ou enviar foto do computador/celular<input type=file accept="image/*" onchange="upf(this)"></label>':''}<div class=row><button type=button class=g onclick=cm()>Cancelar</button><button>Salvar</button></div></form>`;$('#mw').style.display='grid'}
async function sv(e,t,id){e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=v===''?null:v);const{error}=await(id?sb.from(t).update(o).eq('id',id):sb.from(t).insert(o));if(error)return alert(error.message);cm();await load();go(cur);return false}
async function del(t,id){if(!confirm('Excluir este item?'))return;const{error}=await sb.from(t).delete().eq('id',id);if(error)return alert(error.message);await load();go(cur)}
async function upd(t,id,o){await sb.from(t).update(o).eq('id',id);await load();go(cur)}

/* ---- Kits ---- */
function ekit(id){const k=D.kits.find(x=>x.id==id)||{};const q=p=>(D.kit_itens.find(i=>i.kit_id==id&&i.peca_id==p.id)||{}).qtd||0;
$('#md').innerHTML=`<form onsubmit="return svk(event,${id||0})"><h3>Kit</h3><label>Nome do kit<input name=nome value="${k.nome||''}" required></label><label>Desconto no total (%)<input name=desconto_pct type=number step=any value="${k.desconto_pct??10}"></label><p><b>Quantidade de cada peça no kit</b> (0 = fora do kit)</p>${D.pecas.map(p=>`<label>${p.nome}<input type=number min=0 name="p${p.id}" value="${q(p)}"></label>`).join('')}<div class=row><button type=button class=g onclick=cm()>Cancelar</button><button>Salvar kit</button></div></form>`;$('#mw').style.display='grid'}
async function svk(e,id){e.preventDefault();const f=new FormData(e.target),o={nome:f.get('nome'),desconto_pct:N(f.get('desconto_pct'))};let kid=id;if(id)await sb.from('kits').update(o).eq('id',id);else{const{data}=await sb.from('kits').insert(o).select().single();kid=data.id}
await sb.from('kit_itens').delete().eq('kit_id',kid);const it=D.pecas.map(p=>({kit_id:kid,peca_id:p.id,qtd:N(f.get('p'+p.id))})).filter(i=>i.qtd>0);if(it.length)await sb.from('kit_itens').insert(it);cm();await load();go('kits');return false}

/* ---- Vendas ---- */
const keep=()=>{if($('#vd')){S.data=$('#vd').value;S.cli=$('#vc').value;S.k=$('#vk').value;S.s=$('#vs').value;S.vp=$('#vp').value}};
function vnew(){S={items:[],desc:0};rv();$('#mw').style.display='grid'}
function addP(id){keep();const p=D.pecas.find(x=>x.id==id);if(!p)return;const e=S.items.find(x=>x.peca_id==p.id);if(e){e.qtd++;e.valor=pv(p.id,e.qtd);return rv()}S.items.push({peca_id:p.id,nome:p.nome,qtd:1,valor:pv(p.id,1),custo:N(p.custo),fil:'',fils:rc(p).map(()=>'')});rv()}
function addK(id){keep();const k=D.kits.find(x=>x.id==id);if(!k)return;D.kit_itens.filter(i=>i.kit_id==id).forEach(i=>{const p=D.pecas.find(x=>x.id==i.peca_id);S.items.push({peca_id:p.id,nome:p.nome,qtd:i.qtd,valor:N(p.preco),custo:N(p.custo),fil:'',fils:rc(p).map(()=>'')})});S.desc=N(k.desconto_pct);rv()}
function rv(){keep();const av=S.items.filter(i=>{const p=D.pecas.find(x=>x.id==i.peca_id);if(!p)return false;if(mc(p))return need(p,i.qtd).some((g,j)=>{const f=D.filamentos.find(x=>x.id==(i.fils||[])[j]);return f&&N(f.gramas_restantes)<g});const f=D.filamentos.find(x=>x.id==i.fil);return f&&N(f.gramas_restantes)<N(p.gramas)*i.qtd}).map(i=>i.nome);const sub=S.items.reduce((a,i)=>a+i.qtd*i.valor,0),tot=sub*(1-S.desc/100),cus=S.items.reduce((a,i)=>a+i.qtd*i.custo,0);
$('#md').innerHTML=`<h3>${S.id?'Editar venda':'Nova venda'}</h3><div class=g2><label>Data<input id=vd type=date value="${S.data||new Date().toISOString().slice(0,10)}"></label><label>Cliente<input id=vc list=cl placeholder="Digite ou escolha" value="${S.cli||''}"><datalist id=cl>${D.clientes.map(c=>`<option value="${c.nome}">`).join('')}</datalist></label><label>Canal<select id=vk>${opt(['Presencial','WhatsApp'],S.k)}</select></label><label>Status<select id=vs>${opt(['Na fila','Imprimindo','Pronto','Entregue'],S.s)}</select></label></div>
<div class=g2><label>Adicionar peça<select onchange="addP(this.value)"><option value="">Escolher...${D.pecas.map(p=>`<option value=${p.id}>${p.nome}</option>`).join('')}</select></label><label>Adicionar kit<select onchange="addK(this.value)"><option value="">Escolher...${D.kits.map(k=>`<option value=${k.id}>${k.nome}</option>`).join('')}</select></label></div>
${tb(['Peça','Cor','Qtd','Valor un.',''],S.items.map((i,n)=>[i.nome,`${cs(i,n)}`,`<input type=number min=1 style="width:64px" value=${i.qtd} onchange="S.items[${n}].qtd=N(this.value);S.items[${n}].valor=pv(S.items[${n}].peca_id,N(this.value));rv()">`,`<input type=number step=any style="width:90px" value=${i.valor} onchange="S.items[${n}].valor=N(this.value);rv()">`,`<button class=ic onclick="S.items.splice(${n},1);rv()">🗑️</button>`]))}
${av.length?`<p class=low>⚠️ O rolo escolhido pode não ter gramas para: ${av.join(', ')}. Você ainda pode salvar.</p>`:''}<label>Desconto no total (%)<input type=number step=any value=${S.desc} onchange="keep();S.desc=N(this.value);rv()"></label><label>Valor já pago / sinal (R$)<input id=vp type=number step=any value="${S.vp||0}"></label>
<p>Subtotal ${R(sub)} | <b>Total ${R(tot)}</b> | Custo ${R(cus)} | Lucro ${R(tot-cus)}</p><div class=row><button class=g onclick="cp(txt($('#vc').value,S.items.map(i=>[i.qtd,i.nome,i.valor]),S.desc,${tot}))">Copiar orçamento</button><button class=g onclick=cm()>Cancelar</button><button onclick=vsave()>Salvar venda</button></div>`}
async function vsave(){keep();if(!S.items.length)return alert('Adicione pelo menos uma peça.');const sub=S.items.reduce((a,i)=>a+i.qtd*i.valor,0),cus=S.items.reduce((a,i)=>a+i.qtd*i.custo,0),tot=sub*(1-S.desc/100),vp=N(S.vp);
let cid=null;const nm=(S.cli||'').trim();if(nm){let c=D.clientes.find(x=>x.nome.toLowerCase()==nm.toLowerCase());if(!c){const r=await sb.from('clientes').insert({nome:nm}).select().single();c=r.data}cid=c?c.id:null}
const mexe=async(id,dg)=>{const f=D.filamentos.find(x=>x.id==id);if(!f)return;f.gramas_restantes=Math.max(0,N(f.gramas_restantes)+dg);if(f.gramas_restantes<=0)f.situacao='Esgotado';else if(f.situacao=='Esgotado')f.situacao='Em estoque';await sb.from('filamentos').update({gramas_restantes:f.gramas_restantes,situacao:f.situacao||'Em estoque'}).eq('id',id)};
const rl=i=>{const p=D.pecas.find(x=>x.id==i.peca_id)||{};if(mc(p))return need(p,i.qtd).map((g,j)=>({fil:+(i.fils||[])[j]||null,g})).filter(r=>r.fil&&r.g>0);return i.fil?[{fil:+i.fil,g:N(p.gramas)*i.qtd}]:[]};
if(S.id){for(const o of D.itens_venda.filter(i=>i.venda_id==S.id)){if(o.rolos&&o.rolos.length)for(const r of o.rolos)await mexe(r.fil,N(r.g));else{const p=D.pecas.find(x=>x.id==o.peca_id);if(o.filamento_id&&p)await mexe(o.filamento_id,N(p.gramas)*o.qtd)}}await sb.from('itens_venda').delete().eq('venda_id',S.id)}
const o={data:S.data,cliente:nm||null,cliente_id:cid,canal:S.k||'Presencial',status:S.s||'Na fila',desconto_pct:S.desc,total:tot,custo:cus,valor_pago:vp,pago:vp>0&&vp>=tot};
const{data,error}=await(S.id?sb.from('vendas').update(o).eq('id',S.id):sb.from('vendas').insert(o)).select().single();if(error)return alert(error.message);
const ins=await sb.from('itens_venda').insert(S.items.map(i=>({venda_id:data.id,peca_id:i.peca_id,filamento_id:i.fil||(rl(i)[0]||{}).fil||null,rolos:rl(i),nome:i.nome,qtd:i.qtd,valor_unit:i.valor,custo_unit:i.custo})));if(ins.error)return alert(ins.error.message);
for(const i of S.items)for(const r of rl(i))await mexe(r.fil,-r.g);
cm();await load();go('vendas')}

/* ---- Calculadora ---- */
function calc(){const c=D.cfg,L=[0,1,2,3].map(j=>({g:N($('#cg'+j).value),p:N($('#cp'+j).value),f:CFS[j]})),G=L.reduce((a,x)=>a+x.g,0),pu=N($('#cu').value),g=G+pu,h=N($('#ch').value),w=N($('#cw').value),tf=N($('#ct').value),
fil=L.reduce((a,x)=>a+x.g/1000*x.p,0)+(G?pu/1000*L.reduce((a,x)=>a+x.g*x.p,0)/G:0),en=w/1000*h*tf,des=N($('#cd').value)*h,emb=N($('#ce').value),mo=N($('#cm').value)/60*N(c.mao_obra_hora),sub=fil+en+des+emb+mo,fa=sub*N($('#cf').value)/100,cu=sub+fa,mg=N($('#cx').value),pr=cu*(1+mg/100);
$('#cr').innerHTML=[['Filamento',fil],['Energia',en],['Desgaste',des],['Falhas',fa],['Embalagem',emb],['Mão de obra',mo]].map(([a,b])=>`<div><span>${a}</span><span>${R(b)}</span></div>`).join('')+`<hr><div><span>Custo total</span><b style="font-size:20px">${R(cu)}</b></div>${L.filter(x=>x.f&&x.g>N(x.f.gramas_restantes)).map(x=>`<p>⚠️ ${x.f.cor}: o rolo tem só ${Math.round(x.f.gramas_restantes)}g</p>`).join('')}<p style="margin:12px 0 0">Preço de venda</p><b>${R(pr)}</b><div><span>Lucro</span><span>${R(pr-cu)}</span></div><div class=row><button style="background:var(--cr);color:var(--br)" onclick="svpeca(${cu},${pr})">Salvar como peça</button></div>`;window.CC={g,h,L,pu}}
async function svpeca(cu,pr){const n=prompt('Nome da peça:');if(!n)return;await sb.from('pecas').insert({nome:n,gramas:CC.g,horas:CC.h,receita:CC.L.filter(x=>x.g>0).map(x=>({cor:x.f?x.f.cor:'',material:x.f?x.f.material:'',g:x.g})),purga_g:CC.pu,custo:+cu.toFixed(2),preco:+pr.toFixed(2)});await load();go('pecas')}
function pickF(j,id){const f=D.filamentos.find(x=>x.id==id);CFS[j]=f||null;if(f)$('#cp'+j).value=f.preco_kg;calc()}
function pickI(id){const i=D.impressoras.find(x=>x.id==id);if(i){$('#cw').value=i.watts;calc()}}
